repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
      - id: maturin-gluex-rs-py
        name: maturin build gluex-rs-py
        entry: uvx maturin develop --uv --generate-stubs
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: ruff check .yamloom.py python
        language: system
        pass_filenames: false
      - id: ty
        name: ty
        entry: ty check python/tests
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest python/tests
        language: system
        pass_filenames: false
  - repo: https://github.com/denehoffman/yamloom
    rev: yamloom-v0.6.1
    hooks:
      - id: yamloom-sync
        files: ^(\.github/workflows/.*\.ya?ml|\.yamloom\.py)$
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
