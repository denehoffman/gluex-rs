[package]
name = "gluex-rs"
version = "0.1.0"
description = "Unified Rust, Python, and command-line utilities for the GlueX experiment"
authors = ["Nathaniel Dene Hoffman <nhoffman@wm.edu>"]
edition = "2024"
homepage = "https://github.com/denehoffman/gluex-rs"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/denehoffman/gluex-rs"
rust-version = "1.97.1"
readme = "README.md"
documentation = "https://docs.rs/gluex-rs"
keywords = ["gluex", "physics", "ccdb", "rcdb", "hddm"]

[lib]
name = "gluex_rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gluex"
path = "src/main.rs"

[features]
default = []
python = ["dep:numpy", "dep:pyo3"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
dashmap = "6.1.0"
fastrand = "2.4.1"
hddm = "0.2.1"
itertools = "0.15.0"
laddu = "0.21.3"
lazy_static = "1.5.0"
memchr = "2.8.3"
numpy = { version = "0.29.0", optional = true }
parking_lot = "0.12.5"
pyo3 = { version = "0.29.0", optional = true, features = [
    "abi3-py310",
    "chrono",
    "experimental-inspect",
    "extension-module",
] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
shellexpand = "3.1.2"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.19"
tempfile = "3.23.0"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"

[build-dependencies]
anyhow = "1.0.104"
hddm = "0.2.1"
hddm-rs = "0.2.1"

[[bench]]
name = "ccdb_fetch"
harness = false

[[bench]]
name = "ccdb_parse_vault"
harness = false

[[bench]]
name = "rcdb_fetch"
harness = false

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "off"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
significant_drop_tightening = "allow"
